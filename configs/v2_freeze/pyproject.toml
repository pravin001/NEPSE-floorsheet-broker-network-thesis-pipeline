[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nepsemsc"
version = "0.1.0"
description = "Broker Networks, Concentration, and Market Integrity in a Frontier Exchange: Evidence from NEPSE Floorsheets (MSc thesis pipeline)"
authors = [
  { name = "Prabin Shrestha", email = "itsme_prabin@outlook.com" },
]
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy>=2.0",
  "scipy>=1.14",
  "pandas>=3.1",
  "pyarrow>=18",
  "duckdb>=1.0",
  "networkx>=3.3",
  "scikit-learn>=1.5",
  "linearmodels>=6.1",
  "statsmodels>=0.14.4",
  "arch>=8.0",
  "plotly>=5.24",
  "dash>=2.18",
  "dash-bootstrap-components>=1.7",
  "requests>=2.31",
  "tqdm",
  "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov", "hypothesis", "nbmake", "jupyterlab", "ipykernel"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "network: tests that hit the network (opt-in)",
  "slow: long-running tests (opt-in)",
]
